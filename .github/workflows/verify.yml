name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shell syntax check
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r bash -n

      - name: python compile check
        run: |
          find . -name '*.py' -not -path './.git/*' -print0 | xargs -0 -r -n1 python3 -m py_compile

      - name: hook blocks destructive commands
        run: |
          set -e
          HOOK="$PWD/security-hook/block-destructive.py"
          for cmd in "rm -rf /tmp/foo" "git push --force origin main" "TRUNCATE users" "DELETE FROM users"; do
            out=$(printf '{"tool_name":"Bash","tool_input":{"command":"%s"}}' "$cmd" | python3 "$HOOK")
            echo "cmd=$cmd -> $out"
            echo "$out" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['decision']=='block', str(d); assert d['hookSpecificOutput']['permissionDecision']=='deny'"
          done
          echo "4 destructive commands blocked: OK"

      - name: hook allows normal commands
        run: |
          set -e
          HOOK="$PWD/security-hook/block-destructive.py"
          for cmd in "ls -la" "git status" "python3 -m pytest" "npm install"; do
            out=$(printf '{"tool_name":"Bash","tool_input":{"command":"%s"}}' "$cmd" | python3 "$HOOK")
            echo "cmd=$cmd -> $out"
            echo "$out" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['decision']=='approve', str(d)"
          done
          echo "4 normal commands allowed: OK"

      - name: changelog generator produces real output
        run: |
          set -e
          rm -rf /tmp/cl && mkdir -p /tmp/cl && cd /tmp/cl
          git init -q
          git config user.email t@t.com
          git config user.name t
          echo v1 > a.txt && git add -A && git commit -qm "feat: initial project scaffold"
          git tag v1.0.0
          echo x >> a.txt && git add -A && git commit -qm "fix: correct off-by-one in parser"
          echo y >> a.txt && git add -A && git commit -qm "docs: document the API"
          bash "$GITHUB_WORKSPACE/changelog-skill/changelog.sh" -o CHANGELOG.md
          test -f CHANGELOG.md || { echo "FAIL: no CHANGELOG.md"; exit 1; }
          cat CHANGELOG.md
          grep -qi "fix" CHANGELOG.md || { echo "FAIL: no fix entry"; exit 1; }
          echo "changelog OK"

      - name: PR review agent CLI responds
        run: |
          set -e
          python3 pr-review-agent/claude-review.py --help | head -5
